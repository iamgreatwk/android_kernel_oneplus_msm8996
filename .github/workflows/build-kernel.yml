name: Build OnePlus 3 Kernel

on:
  push:
    branches: [lineage-18.1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            flex bison bc \
            libssl-dev libelf-dev \
            make git python

      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Build kernel
        run: |
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out lineageos_oneplus3_defconfig
          scripts/config --file out/.config -e CONFIG_VT
          scripts/config --file out/.config -e CONFIG_VT_CONSOLE
          scripts/config --file out/.config -e CONFIG_FRAMEBUFFER_CONSOLE
          scripts/config --file out/.config -e CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY
          scripts/config --file out/.config -e CONFIG_FONT_8x16
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out olddefconfig
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            O=out -j$(nproc)

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneplus3-kernel
          path: out/arch/arm64/boot/Image.gz
