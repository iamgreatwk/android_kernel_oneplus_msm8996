name: Build WiFi Module for TWRP Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y \
            flex bison bc \
            libssl-dev libelf-dev \
            make git wget xz-utils

      - name: Download GCC 4.9 toolchain
        run: |
          wget https://releases.linaro.org/components/toolchain/binaries/4.9-2016.02/aarch64-linux-gnu/gcc-linaro-4.9.4-2016.02-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-*.tar.xz
          echo "$PWD/gcc-linaro-4.9.4-2016.02-x86_64_aarch64-linux-gnu/bin" >> $GITHUB_PATH
          aarch64-linux-gnu-gcc --version

      - name: Checkout exact TWRP commit
        run: |
          git clone https://github.com/LineageOS/android_kernel_oneplus_msm8996.git .
          git fetch origin 4a67382
          git checkout 4a67382

      - name: Prepare kernel config
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineageos_oneplus3_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

      - name: Build WiFi module
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/staging/prima -j$(nproc) 2>&1 || echo "prima failed"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/staging/qcacld-2.0 -j$(nproc) 2>&1 || echo "qcacld failed"
          echo "=== Found .ko ==="
          find . -name "*.ko"

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: wifi-modules
          path: "**/*.ko"
