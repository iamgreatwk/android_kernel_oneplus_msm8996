name: Build WiFi Module (GCC 4.9)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y flex bison bc libssl-dev libelf-dev make git

      - name: Get LineageOS GCC 4.9
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc49
          echo "$PWD/gcc49/bin" >> $GITHUB_PATH

      - name: Get kernel source + build
        run: |
          git clone https://github.com/LineageOS/android_kernel_oneplus_msm8996.git kernel
          cd kernel
          git checkout 4a67382
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- lineageos_oneplus3_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- modules_prepare
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- M=drivers/staging/prima -j$(nproc) || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- M=drivers/staging/qcacld-2.0 -j$(nproc) || true
          echo "=== KO files ==="
          find . -name "*.ko"

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: wifi-modules-gcc49
          path: "**/*.ko"
