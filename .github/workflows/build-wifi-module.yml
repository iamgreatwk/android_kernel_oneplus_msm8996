name: Build WiFi Module for TWRP Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Build in Ubuntu 16.04 with GCC 4.9
        run: |
          docker run --rm -v $PWD:/work ubuntu:16.04 bash -c '
            sed -i "s/archive.ubuntu.com/old-releases.ubuntu.com/g" /etc/apt/sources.list
            sed -i "s/security.ubuntu.com/old-releases.ubuntu.com/g" /etc/apt/sources.list
            apt-get update
            apt-get install -y gcc-4.9-aarch64-linux-gnu flex bison bc libssl-dev libelf-dev make git
            
            cd /work
            git clone --depth 1 https://github.com/LineageOS/android_kernel_oneplus_msm8996.git .
            git fetch origin 4a67382
            git checkout 4a67382
            
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CC=aarch64-linux-gnu-gcc-4.9
            
            make ARCH=arm64 lineageos_oneplus3_defconfig
            
            # 把 WiFi 从内置(Y)改成模块(M)
            sed -i "s/CONFIG_QCA_CLD_WLAN=y/CONFIG_QCA_CLD_WLAN=m/" .config
            sed -i "s/CONFIG_WLAN=y/CONFIG_WLAN=m/" .config
            make ARCH=arm64 olddefconfig
            
            make ARCH=arm64 modules_prepare
            make ARCH=arm64 modules -j$(nproc)
            echo "=== KO files ==="
            find . -name "*.ko"
          '

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: wifi-modules-ko
          path: "**/*.ko"
