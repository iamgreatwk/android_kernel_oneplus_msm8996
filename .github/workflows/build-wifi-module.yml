name: Build WiFi Module (GCC 4.9)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get LineageOS GCC 4.9 (64bit + 32bit)
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
          echo "$PWD/gcc64/bin" >> $GITHUB_PATH
          echo "$PWD/gcc32/bin" >> $GITHUB_PATH

      - name: Get kernel source + build
        run: |
          git clone https://github.com/LineageOS/android_kernel_oneplus_msm8996.git kernel
          cd kernel
          git checkout 4a67382
          
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            lineageos_oneplus3_defconfig
            
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j$(nproc) scripts
            
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            M=drivers/staging/prima -j$(nproc) || true
            
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            M=drivers/staging/qcacld-2.0 -j$(nproc) || true
            
          echo "=== KO files ==="
          find . -name "*.ko"

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: wifi-modules
          path: kernel/**/*.ko
