name: Build Kernel (lineage-16.0 + GCC 4.9 + wlan module)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Build Kernel
        run: |
          docker run --rm -v $PWD:/work -w /work ubuntu:18.04 bash -c '
            export DEBIAN_FRONTEND=noninteractive
            ln -fs /usr/share/zoneinfo/UTC /etc/localtime
            dpkg --add-architecture i386
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential git make flex bison bc libssl-dev libelf-dev \
              gcc g++ gcc-multilib g++-multilib \
              libc6 libc6:i386 libstdc++6 libstdc++6:i386 \
              lib32z1 lib32ncurses5 lib32stdc++6 \
              libncurses5 libncurses5:i386 zlib1g:i386 \
              libncurses5-dev zip ccache cpio libglib2.0-0 kmod ca-certificates \
              curl wget python python3
            mkdir -p /lib64
            ln -sf /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2
            
            git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b cm-14.1 gcc64
            git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git -b cm-14.1 gcc32
            
            GCC64_PREFIX="$(pwd)/gcc64/bin/aarch64-linux-android-"
            GCC32_PREFIX="$(pwd)/gcc32/bin/arm-linux-androideabi-"
            
            git clone --depth 1 --branch lineage-16.0 https://github.com/LineageOS/android_kernel_oneplus_msm8996.git kernel
            cd kernel

            # Allow WLAN as module
            sed -i "/menuconfig WLAN/{n;s/bool/tristate/}" drivers/net/wireless/Kconfig
            
            make ARCH=arm64 CROSS_COMPILE=${GCC64_PREFIX} CROSS_COMPILE_ARM32=${GCC32_PREFIX} O=out lineageos_oneplus3_defconfig
            scripts/config --file out/.config --enable CONFIG_MODULES
            scripts/config --file out/.config --module CONFIG_WLAN
            scripts/config --file out/.config --module CONFIG_QCA_CLD_WLAN
            make ARCH=arm64 CROSS_COMPILE=${GCC64_PREFIX} CROSS_COMPILE_ARM32=${GCC32_PREFIX} O=out olddefconfig
            make ARCH=arm64 CROSS_COMPILE=${GCC64_PREFIX} CROSS_COMPILE_ARM32=${GCC32_PREFIX} KCFLAGS="-Wno-error" HOSTCFLAGS="-fcommon" O=out -j$(nproc) Image.gz-dtb modules

            mkdir -p /work/output
            cp out/arch/arm64/boot/Image.gz-dtb /work/output/
            find out -name "*.ko" -exec cp {} /work/output/ \;
            echo "=== Built modules ==="
            ls -la /work/output/
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-wlan-module
          path: output/
