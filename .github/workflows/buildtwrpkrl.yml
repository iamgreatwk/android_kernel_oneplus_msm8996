name: Build Kernel (lineage-16.0 + GCC 4.9)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:18.04

    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: UTC
        run: |
          ln -fs /usr/share/zoneinfo/UTC /etc/localtime
          
          dpkg --add-architecture i386
          apt-get update
          
          # 安装编译基础件 + 兼容库 + git-lfs
          apt-get install -y --no-install-recommends \
            build-essential git git-lfs make flex bison bc libssl-dev libelf-dev \
            gcc g++ gcc-multilib g++-multilib \
            libc6 libc6:i386 libstdc++6 libstdc++6:i386 \
            lib32z1 lib32ncurses5 lib32stdc++6 \
            libncurses5 libncurses5:i386 zlib1g:i386 \
            libncurses5-dev zip ccache cpio libglib2.0-0 kmod ca-certificates \
            curl wget file

          # 初始化 git lfs
          git lfs install

      - name: Build Kernel
        run: |
          # 1. 克隆 GCC 工具链并拉取真正的 LFS 大文件二进制
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b lineage-19.1 gcc64
          cd gcc64 && git lfs pull && cd ..

          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git -b lineage-19.1 gcc32
          cd gcc32 && git lfs pull && cd ..

          GCC64_PREFIX="$(pwd)/gcc64/bin/aarch64-linux-android-"
          GCC32_PREFIX="$(pwd)/gcc32/bin/arm-linux-androideabi-"

          # 2. 验证 GCC 执行文件（此时已经拉取到了真实的 ELF 可执行文件）
          echo "=== Testing GCC Executable ==="
          ${GCC64_PREFIX}gcc --version

          # 3. 克隆内核源码
          git clone --depth 1 --branch lineage-16.0 https://github.com/LineageOS/android_kernel_oneplus_msm8996.git kernel
          cd kernel

          # 4. 生成 Defconfig 配置
          make ARCH=arm64 \
            CROSS_COMPILE=${GCC64_PREFIX} \
            CROSS_COMPILE_ARM32=${GCC32_PREFIX} \
            O=out lineageos_oneplus3_defconfig

          # 5. 开启编译
          make ARCH=arm64 \
            CROSS_COMPILE=${GCC64_PREFIX} \
            CROSS_COMPILE_ARM32=${GCC32_PREFIX} \
            KCFLAGS="-Wno-error" \
            O=out -j$(nproc) Image.gz-dtb

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lineage16-oneplus3
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
