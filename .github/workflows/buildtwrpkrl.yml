name: Build Kernel (Google GCC 4.9)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04

    steps:
      - name: Install deps
        run: apt-get update && apt-get install -y git make flex bison bc libssl-dev libelf-dev

      - name: Build
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32
          export PATH="$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH"

          git clone --depth 1 https://github.com/LineageOS/android_kernel_oneplus_msm8996.git kernel
          cd kernel

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            O=out lineageos_oneplus3_defconfig

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KCFLAGS="-Wno-error" \
            O=out -j$(nproc)

          echo "=== Size ==="
          ls -la out/arch/arm64/boot/Image.gz*
          echo "=== DTB ==="
          strings out/arch/arm64/boot/Image.gz-dtb | grep "qcom,mdss_mdp" | head -3

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-android-gcc49
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
