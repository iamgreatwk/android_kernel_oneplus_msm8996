name: Build WiFi Module + Full Kernel (force load)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04

    steps:
      - name: Install deps
        run: |
          apt-get update && apt-get install -y \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            flex bison bc libssl-dev libelf-dev make git

      - name: Build
        run: |
          git clone https://github.com/LineageOS/android_kernel_oneplus_msm8996.git kernel
          cd kernel
          git checkout 4a67382
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            lineageos_oneplus3_defconfig
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" -j$(nproc)

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: twrp-kernel-wifi
          path: kernel/arch/arm64/boot/Image.gz
